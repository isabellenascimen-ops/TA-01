services:
  postgres:
    # Imagem com pgvector já compilado — evita compilar a extensão manualmente.
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: trajectory
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-trajectory_dev_pw}
      POSTGRES_DB: trajectory_dev
    ports:
      - "5432:5432"
    volumes:
      # Volume nomeado: a trajetória sobrevive a `docker compose down`
      # (seção 7 da spec — continuidade entre reinicializações).
      - trajectory_pgdata:/var/lib/postgresql/data
      - ./ops/init_extensions.sql:/docker-entrypoint-initdb.d/00_extensions.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trajectory -d trajectory_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+asyncpg://trajectory:${POSTGRES_PASSWORD:-trajectory_dev_pw}@postgres:5432/trajectory_dev
      LLM_PROVIDER: ${LLM_PROVIDER:-local_stub}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-5}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:8b}
      OLLAMA_THINK: ${OLLAMA_THINK:-false}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-local_hash}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    # Migrations rodam antes do servidor: o schema nunca fica atrás do código.
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

volumes:
  trajectory_pgdata:
